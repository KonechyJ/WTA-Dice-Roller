<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World of Darkness Roller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="menuBtn" class="menu-btn">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Menu</h3>
            <button id="closeBtn" class="close-btn">&times;</button>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-item toggle-item">
                <span>Split View</span>
                <label class="switch">
                    <input type="checkbox" id="splitViewToggle">
                    <span class="slider round"></span>
                </label>
            </div>
                <div class="sidebar-item toggle-item">
                <span>Light Mode</span>
                <label class="switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="sidebar-item toggle-item">
                <label for="glitchToggle" style="font-size: 0.9rem;">Glitch Icons?</label>
                <label class="switch">
                    <input type="checkbox" id="glitchToggle">
                    <span class="slider round"></span>
                </label>
            </div>
                    
            <button class="sidebar-item">Character Presets</button>
            <button class="sidebar-item">Dice Log</button>
            <button class="sidebar-item">App Settings</button>
        </div>
    </div>

    <div id="overlay" class="overlay"></div>

<nav class="app-nav">
        <button class="nav-item active" data-target="page-w20">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span>W20</span>
        </button>
        <button class="nav-item" data-target="page-v5">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2.69l5.74 5.74c3.12 3.12 3.12 8.19 0 11.31C16.18 21.31 14.09 22.08 12 21.31c-2.09.77-4.18 0-5.74-1.56-3.12-3.12-3.12-8.19 0-11.31L12 2.69z"></path>
            </svg>
            <span>V5</span>
        </button>
        <button class="nav-item" data-target="page-dw">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="22" y1="12" x2="18" y2="12"></line>
                <line x1="6" y1="12" x2="2" y2="12"></line>
                <line x1="12" y1="6" x2="12" y2="2"></line>
                <line x1="12" y1="22" x2="12" y2="18"></line>
            </svg>
            <span>DW</span>
        </button>
    </nav>

    <div class="main-layout">
        
        <div class="container" id="mainContainer">
            <div id="page-w20" class="tab-page active">
                <h1>Werewolf The Apocalypse W20 - Dice Roller</h1>
                <div class="controls">
                    <div class="input-group">
                        <label for="dicePool">Dice Pool</label>
                        <input type="number" id="dicePool" value="1" min="1" max="20">
                    </div>
                    <div class="input-group">
                        <label for="difficulty">Difficulty</label>
                        <input type="number" id="difficulty" value="6" min="2" max="10">
                    </div>
                    <div class="input-group">
                        <label for="specialtyToggle" style="font-size: 0.9rem;">Specialty?</label>
                        <input type="checkbox" id="specialtyToggle" style="width: 20px; height: 20px; margin-top: 10px; cursor: pointer;">
                    </div>

                    <div class="input-group split-group">
                        <label for="splitActionToggle" style="font-size: 0.9rem; color: #ff9800;">Split Action?</label>
                        <input type="checkbox" id="splitActionToggle" style="width: 20px; height: 20px; margin-top: 10px; cursor: pointer;">
                        
                        <div id="splitInputContainer" class="split-input-container hidden">
                            <label for="splitActionIndex" class="tiny-label"># Actions</label>
                            <input type="number" id="splitActionIndex" value="2" min="2" max="10">
                        </div>
                    </div>
                </div>

                <button id="rollBtn" class="primary-btn">ROLL</button>
                <div id="resultText" class="result-text"></div>
                <div id="diceContainer" class="dice-container-wrapper"></div>

                <div class="action-row">
                    <button id="wpSpendBtn" class="secondary-btn hidden">Spend Willpower (+1 Success)</button>
                    <button id="explodeBtn" class="explode-btn hidden">CRITICAL! Reroll (0)</button>
                </div>
            </div>

            <div id="page-v5" class="tab-page">
                <h1>Vampire the Masquerade V5 - Dice Roller</h1>
                <div class="controls">
                    <div class="input-group">
                        <label for="v5Pool">Total Pool</label>
                        <input type="number" id="v5Pool" value="5" min="1" max="20">
                    </div>
                    <div class="input-group">
                        <label for="v5Hunger">Hunger</label>
                        <input type="number" id="v5Hunger" value="1" min="0" max="5">
                    </div>

                    <div class="input-group" style="display: none;">
                        <label for="v5Diff">Difficulty</label>
                        <input type="number" id="v5Diff" value="1" min="1" max="10">
                    </div>
                </div>

                <button id="v5RollBtn" class="primary-btn">ROLL V5</button>
                <div id="v5ResultText" class="result-text"></div>
                <div id="v5InstructionText" style="min-height: 1.5em; font-weight: bold; margin-bottom: 15px;"></div>

                <div id="v5DiceContainer" class="dice-container-wrapper"></div>

                <div class="action-row">
                    <button id="v5WpBtn" class="secondary-btn hidden">Spend Willpower (Reroll up to 3)</button>
                    <button id="v5ConfirmWpBtn" class="explode-btn hidden">Confirm Reroll</button>
                </div>
            </div>
            <div id="page-dw" class="tab-page hidden">
                <div style="text-align: center; margin-top: 10px; margin-bottom: 20px;">
                    <h2 style="margin-bottom: 5px;">Deathwatch Roller</h2>
                    <span style="color: #666; font-size: 0.9rem;">Deathwatch & General Utility</span>
                </div>

               <div class="dice-input-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <div>
                        <label style="display: block; margin-bottom: 8px; color: var(--accent); font-size: 0.9rem;">Quantity:</label>
                        <input type="number" id="dwQty" value="1" min="1" max="20" style="width: 100%; box-sizing: border-box; padding: 10px; background: var(--die-bg); border: 1px solid #555; color: white; border-radius: 4px;">
                    </div>
                    
                    <div>
                        <label style="display: block; margin-bottom: 8px; color: var(--accent); font-size: 0.9rem;">Die Type:</label>
                        <select id="dwType" style="width: 100%; box-sizing: border-box; padding: 10px; background: var(--die-bg); border: 1px solid #555; color: white; border-radius: 4px; height: 38px;">
                            <option value="6">d6</option>
                            <option value="8">d8</option>
                            <option value="10">d10</option>
                            <option value="12">d12</option>
                            <option value="20">d20</option>
                            <option value="100" selected>d100</option>
                        </select>
                    </div>
                </div>

                    <div id="dwTargetSection" style="margin-bottom: 15px;">
                        <label for="dwTarget" style="display: block; margin-bottom: 8px; color: var(--accent);">Target (d100 only):</label>
                        <input type="number" id="dwTarget" value="50" min="1" max="120" style="width: 100%; padding: 10px; background: var(--die-bg); border: 1px solid #555; color: white; border-radius: 4px;">
                    </div>

                    <button id="dwRollBtn" class="action-btn" style="width: 100%; background-color: var(--accent); color: white; border: none; padding: 15px; border-radius: 4px; font-size: 1.1rem; cursor: pointer; font-weight: bold;">
                        Roll Dice
                    </button>
                </div>

                <div id="dwResultText" class="result-text" style="margin-top: 20px; text-align: center; font-size: 1.2rem; min-height: 60px;"></div>
            </div>
        </div>

        <div id="secondaryPanel" class="secondary-panel hidden">
            
            <div id="dropZone" class="drop-zone">
                <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="18" x2="12" y2="12"></line>
                    <line x1="9" y1="15" x2="12" y2="12"></line>
                    <line x1="15" y1="15" x2="12" y2="12"></line>
                </svg>
                <p>Drag & Drop Character Sheet (PDF)<br>or <strong>Click to Upload</strong></p>
                <input type="file" id="fileInput" accept="application/pdf" style="display: none;">
            </div>

            <div id="pdfViewer" class="pdf-viewer hidden">
                <div class="pdf-header">
                    <span id="pdfName">Sheet.pdf</span>
                    <button id="removePdfBtn" class="close-btn" style="font-size: 1rem;">&times; Remove</button>
                </div>
                <object id="pdfObject" type="application/pdf" width="100%" height="100%">
                    <p>Your browser does not support PDFs. <a href="#">Download the PDF</a>.</p>
                </object>
            </div>

        </div>

    </div>

    <script type="module" src="main.js"></script>
    <script type="module" src="w20.js"></script>
    <script type="module" src="v5.js"></script>
    <script type="module" src="dw.js"></script>
</body>
</html>
