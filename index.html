<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf The Apopocalypse V20 - Dice Roller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Werewolf The Apopocalypse V20 - Dice Roller</h1>

        <div class="controls">
            <div class="input-group">
                <label for="dicePool">Dice Pool</label>
                <input type="number" id="dicePool" value="1" min="1" max="20">
            </div>
            <div class="input-group">
                <label for="difficulty">Difficulty</label>
                <input type="number" id="difficulty" value="6" min="2" max="10">
            </div>
            <div class="input-group">
                <label for="specialtyToggle" style="font-size: 0.9rem;">Specialty?</label>
                <input type="checkbox" id="specialtyToggle" style="width: 20px; height: 20px; margin-top: 10px; cursor: pointer;">
            </div>
        </div>

        <button id="rollBtn" class="primary-btn">ROLL</button>

        <div id="resultText" class="result-text"></div>
        
        <div id="diceContainer" class="dice-container-wrapper"></div>

        <div class="action-row">
            <button id="wpSpendBtn" class="secondary-btn hidden">Spend Willpower (+1 Success)</button>
            
            <button id="explodeBtn" class="explode-btn hidden">CRITICAL! Reroll (0)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
